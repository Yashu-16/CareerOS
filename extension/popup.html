<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 16px;
        font-size: 14px;
        color: #111;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
        color: #2d6a1e;
      }
      label {
        display: block;
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #6be82c;
        color: #111;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.secondary {
        background: #f3f4f6;
        color: #374151;
      }
      .status {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
      }
      .ok {
        color: #15803d;
      }
      .err {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>CareerOS Autofill</h1>
    <label for="baseUrl">CareerOS URL</label>
    <input id="baseUrl" placeholder="http://localhost:3000" />
    <label for="token">Extension token</label>
    <input id="token" type="password" placeholder="cos_… from Smart Apply" />
    <button id="save">Save settings</button>
    <button id="autofill" class="secondary">Autofill this page</button>
    <p id="status" class="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
